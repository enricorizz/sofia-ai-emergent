[flake8]
max-line-length = 100
extend-ignore =
    # E203: whitespace before ':' (conflicts with black)
    E203,
    # W503: line break before binary operator (conflicts with black)
    W503,
    # E722: bare except – pre-existing throughout codebase
    E722,
    # F824: global statement with no assignment – pre-existing
    F824,
    # F541: f-string without placeholders – pre-existing in whatsapp_monitor
    F541,
    # E501: line too long – deferred to black; pre-existing in string literals
    E501,
    # F401: imported but unused – pre-existing in gateway_config
    F401,
exclude =
    .git,
    __pycache__,
    .venv,
    node_modules,
    dist,
    build
