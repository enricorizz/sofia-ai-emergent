# ═══════════════════════════════════════════════════════════════════════════════
# CI Pipeline – Sofia AI Emergent
#
# Jobs:
#   backend-lint   – black / isort / flake8 checks
#   backend-test   – pytest unit tests (no real MongoDB required)
#   frontend-lint  – ESLint
#   frontend-build – yarn build (smoke-test the React build)
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Principle of least privilege: all jobs get read-only access by default.
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend – Lint (black / isort / flake8)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install black isort flake8

      - name: black – format check
        run: black --check --diff backend/

      - name: isort – import order check
        run: isort --check-only --diff backend/

      - name: flake8 – style check
        run: flake8 backend/

  # ────────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend – Tests (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: test_moltbot
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Skip emergentintegrations (proprietary, not on PyPI)
          grep -v "emergentintegrations" backend/requirements.txt | pip install -r /dev/stdin

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ────────────────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend – ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: ESLint
        # continue-on-error keeps the pipeline green while resolving legacy warnings,
        # but the annotation is still visible in the PR checks.
        continue-on-error: true
        run: yarn eslint src/ --max-warnings 0

  # ────────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend – Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    env:
      REACT_APP_BACKEND_URL: ""
      # Disable treating warnings as errors during CRA build
      CI: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7
